name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[analysis,dev]"

      - name: Package imports
        run: python -c "import productwebbench, productwebbench.cli"

      - name: CLI responds
        run: pwb --help

      - name: Lint
        run: ruff check productwebbench

      - name: Reproduce every paper number and figure
        run: bash tools/reproduce.sh

      - name: Assert the headline invariants
        run: |
          python - <<'PY'
          import json, pathlib
          cells = pathlib.Path("analysis/_data/cells_flat.jsonl")
          n = sum(1 for _ in cells.open())
          assert n == 8737, f"cell cache is {n} rows, expected 8737"

          e25 = json.load(open("analysis/E25_pristine_regression/e25_results.json"))
          assert len(e25["rows"]) == 4881, len(e25["rows"])
          for k, v in (("class_a", 66), ("class_b", 56), ("both", 16), ("union_a_or_b", 106)):
              assert e25[k] == v, f"{k}={e25[k]}, expected {v}"

          cis = json.load(open("analysis/E25_pristine_regression/clustered_cis.json"))
          print("ok: 8737 cells, e25 4881 rows, class_a 66 / class_b 56 / both 16 / union 106")
          PY

      - name: Upload regenerated figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/*.pdf
